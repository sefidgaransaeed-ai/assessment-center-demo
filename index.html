.heading{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}.heading h1{font-size:20px;margin:0 0 3px;letter-spacing:-.3px}.heading p{margin:0;color:var(--muted);font-size:10px}.actions{margin-right:auto;display:flex;gap:7px}.btn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:#37445a;font-size:10px;font-weight:bold}.btn:hover{box-shadow:0 4px 12px #17283c12;transform:translateY(-1px)}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.teal{background:var(--soft);border-color:#d5eee8;color:#247d6f}.btn.sm{padding:5px 8px;font-size:9px}
.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:14px 16px;min-height:99px}.stathead{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted)}.staticon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;font-size:14px}.statnum{font-size:23px;font-weight:800;line-height:1.3;margin-top:4px}.statfoot{font-size:8px;color:#8c97a7}
.overview{grid-template-columns:minmax(0,1.55fr) minmax(250px,.85fr);align-items:start}.panel{padding:16px}.panelhead{display:flex;align-items:center;gap:9px;margin-bottom:11px}.panelhead h2{font-size:12px;margin:0}.panelhead p{font-size:8px;color:var(--muted);margin:2px 0 0}.panelhead .end{margin-right:auto}.link{border:0;background:transparent;color:#5873ce;font-weight:bold;font-size:9px}
.cycle{padding:15px 17px;border:1px solid #e4eee9;border-radius:12px;background:linear-gradient(115deg,#fff 72%,#f0faf7);margin-bottom:12px}.cycletop{display:flex;justify-content:space-between;align-items:center}.tag{background:#e5f4ee;color:#4a8473;border-radius:20px;padding:3px 8px;font-size:8px}.cycle h3{font-size:13px;margin:8px 0 1px}.cycle p{font-size:9px;color:var(--muted);margin:0}.meta{display:flex;gap:18px;border-top:1px solid #edf0f2;margin-top:11px;padding-top:9px}.meta small{font-size:8px;color:var(--muted)}.meta b{display:block;font-size:10px}.plabel{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin:9px 0 4px}.progress{height:6px;border-radius:8px;background:#edf1f4;overflow:hidden}.progress i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#71cebd,#288d7d)}

.section{display:none}.section.show{display:block}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:9px;outline:none}.toolbar input{width:230px}.candidate-list{display:grid;gap:8px}.candidate{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}.candidate:hover{border-color:#a3d8cf}.candidate .person{flex:1}.candidate .person .avatar{width:35px;height:35px;font-size:9px}.extra{text-align:left;min-width:57px}.extra b{font-size:13px}.extra small{display:block;color:var(--muted);font-size:7px}
.casehead{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:12px}.casehead .avatar{width:45px;height:45px}.casehead .grow{flex:1}.casehead h2{font-size:12px;margin:0}.casehead p{font-size:8px;color:var(--muted);margin:2px 0}.two{grid-template-columns:minmax(0,1.25fr) minmax(250px,.8fr);align-items:start}.comp{display:flex;align-items:center;gap:9px;border-bottom:1px solid #f0f2f4;padding:10px 0}.comp:last-child{border:0}.compname{width:95px;font-size:9px;font-weight:bold}.compbar{flex:1}.compscore{width:30px;text-align:left;font-size:11px;font-weight:800}.source{font-size:7px;color:var(--muted);width:85px}.tree{background:#f8fafb;border:1px solid #edf0f3;border-radius:9px;padding:10px;font-size:8px;line-height:2.2;color:#566279}.tree b{color:#273750}.indent{padding-right:15px}.indent2{padding-right:30px;color:#7d8797}
.notice{border-radius:9px;padding:9px 10px;font-size:8px;line-height:1.8}.info{background:#eff4ff;color:#53698a;border:1px solid #dfe8f9}.warn{background:var(--goldbg);color:#98722f;border:1px solid #f2e5c7}
.kpis{grid-template-columns:repeat(3,1fr);margin-bottom:11px}.kpis .card{padding:9px 11px}.kpis small{font-size:7px;color:var(--muted);display:block}.kpis b{font-size:14px}.vcard{padding:12px 14px;margin-bottom:8px}.vhead{display:flex;align-items:center;gap:9px}.vhead div:nth-child(2){flex:1}.vhead b{font-size:9px}.vhead small{font-size:7px;color:var(--muted);display:block}.vcard .wave{height:17px;margin:8px 0}.transcript{background:#f3f6f9;color:#546177;padding:8px;border-radius:8px;font-size:8px}.vactions{display:flex;gap:6px;margin-top:8px}
.reportgrid{grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);align-items:start}.preview{background:#f6f8fa;border:1px solid #e9edf1;border-radius:10px;padding:14px}.paper{background:white;border:1px solid #e8edf1;box-shadow:0 4px 12px #2437520a;width:205px;min-height:215px;padding:14px;margin:auto}.paperlogo{height:24px;width:24px;border-radius:6px;background:#e5f5f0;color:#268473;display:grid;place-items:center;font-size:9px;font-weight:bold;margin-bottom:9px}.paper h3{font-size:10px;margin:0}.paper small{font-size:7px;color:#8b95a4}.line{height:4px;border-radius:8px;background:#e9edf2;margin:7px 0}.line.med{width:84%}.line.short{width:65%}.blocks{display:flex;gap:4px;margin:10px 0}.blocks i{height:24px;background:#edf7f4;border-radius:5px;flex:1}.checklist{display:grid;gap:9px}.checkrow{display:flex;gap:7px;font-size:8px;color:#4d5b70}.check{width:16px;height:16px;border-radius:5px;background:var(--greenbg);color:var(--green);display:grid;place-items:center;flex-shrink:0}.check.pending{background:var(--goldbg);color:#a57722}
.chart{height:120px;display:flex;align-items:end;gap:13px;padding:7px;border-bottom:1px solid var(--line)}.bargrp{height:100%;flex:1;display:flex;align-items:end;gap:3px;position:relative;padding-bottom:18px}.bar{flex:1;background:#68c6b5;border-radius:4px 4px 0 0}.bar.pale{background:#dce4ed}.barlabel{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:7px;color:var(--muted)}
.modalbg{position:fixed;inset:0;background:#101a2bc4;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modalbg.open{display:flex}.modal{width:min(570px,100%);max-height:90vh;overflow:auto;border-radius:16px;background:#fff;box-shadow:0 25px 65px #10213b55}.modalhead{display:flex;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line)}.modalhead b{font-size:12px}.modalhead button{margin-right:auto;background:none;border:0;font-size:18px;color:var(--muted)}.modalbody{padding:16px 17px}.modalfoot{border-top:1px solid var(--line);padding:11px 17px;display:flex;gap:7px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:8px;font-weight:bold;color:#68758a}.field textarea{min-height:66px;resize:vertical}.fontbox{border:1px dashed #ccd5df;border-radius:9px;padding:10px;margin-top:10px;background:#fafbfd;font-size:9px}
.toast{position:fixed;bottom:18px;left:18px;background:#1d2b42;color:white;border-radius:10px;padding:10px 14px;font-size:9px;box-shadow:0 8px 22px #15243a33;opacity:0;transform:translateY(8px);transition:.2s;z-index:40;pointer-events:none}.toast.show{opacity:1;transform:none}.foot{text-align:center;color:#96a0ad;font-size:7px;padding:13px}
@media(max-width:1000px){.side{width:210px}.main{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.overview,.lower{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.side{display:block;width:auto;padding:10px 12px}.brand{padding:0 2px 9px}.org,.label,.sidebottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:7px 8px;font-size:9px}.main{padding:13px}.top{margin:8px 0 14px}.search{width:42vw}.heading{flex-wrap:wrap}.actions{width:100%;margin:0}.two,.reportgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.source{display:none}.compname{width:80px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="mark">ک</div><div><b>کانون‌یار</b><small>سامانه پشتیبان ارزیابی مدیران</small></div></div><div class="org"><small>سازمان فعال</small><b>گروه توسعه سپهر</b></div><div class="label">منوی اصلی</div>
<nav class="nav"><button class="active" data-view="overview"><i>▦</i>نمای کلی</button><button data-view="candidates"><i>♙</i>پرونده افراد</button><button data-view="voices"><i>◖</i>صندوق ویس‌ها <span class="count" id="count">۳</span></button><button data-view="scores"><i>◈</i>امتیازها</button><button data-view="reports"><i>▤</i>گزارش‌ها</button><button data-view="cycle"><i>⚙</i>تنظیمات دوره</button></nav>
<div class="sidebottom"><div class="storage"><b>۵۸٪</b><small>فضای پوشه دوره</small><div class="track"><i></i></div><small>گروه توسعه سپهر · ۱۴۰۵/۰۷/۱۲</small></div><div class="user"><div class="avatar" style="background:#dce5ff;color:#526abd">م‌ک</div><div><b>مدیر کانون</b><small>تأیید نتیجه و گزارش</small></div></div></div></aside>
<main><header class="top"><div class="crumb">دوره‌ها ‹ <b id="crumb">نمای کلی</b></div><div class="spacer"></div><label class="search"><span>⌕</span><input placeholder="جست‌وجوی پرونده یا ویس..." oninput="searchApp(this.value)"></label><button class="icon" onclick="toast('اعلان جدیدی وجود ندارد')">♧</button><button class="icon" onclick="toast('پوشه محلی دوره آماده است')">▣</button></header><div id="content"></div><div class="foot">نمونه تعاملی · داده‌ها ساختگی‌اند · اتصال واقعی تلگرام و هارد محلی فعال نیست</div></main></div>
<div class="modalbg" id="modalbg" onclick="closeOutside(event)"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><b id="mtitle"></b><button onclick="closeModal()">×</button></div><div class="modalbody" id="mbody"></div><div class="modalfoot" id="mfoot"></div></div></div><div class="toast" id="toast"></div>
<script>
const S={view:"overview",selected:"c1",reports:1,candidates:[
{id:"c1",name:"آرزو نادری",role:"مدیر واحد فروش",initials:"آ‌ن",color:"#dff2ec",assessor:"مریم رضایی",status:"در انتظار تأیید",scores:[["رهبری",8,2],["تصمیم‌گیری",7.5,2],["ارتباط مؤثر",8,2],["تفکر تحلیلی",7,1]]},
{id:"c2",name:"سامان فراهانی",role:"سرپرست عملیات",initials:"س‌ف",color:"#e4eaff",assessor:"علی نوری",status:"در حال ارزیابی",scores:[["رهبری",8,1],["تصمیم‌گیری",7,1],["ارتباط مؤثر",6.5,1],["تفکر تحلیلی",null,0]]},
{id:"c3",name:"نگار موسوی",role:"مدیر پروژه",initials:"ن‌م",color:"#fff0df",assessor:"سارا کاویانی",status:"گزارش آماده",scores:[["رهبری",8.5,2],["تصمیم‌گیری",8,2],["ارتباط مؤثر",9,2],["تفکر تحلیلی",8,2]]},
{id:"c4",name:"پیمان کیانی",role:"مدیر محصول",initials:"پ‌ک",color:"#f5e9f4",assessor:"مریم رضایی",status:"در حال ارزیابی",scores:[["رهبری",7,1],["تصمیم‌گیری",7.5,1],["ارتباط مؤثر",null,0],["تفکر تحلیلی",null,0]]}],
voices:[
{id:"v1",cid:"c1",kind:"صدای تمرین",exercise:"تحلیل بازار",sender:"مریم رضایی",time:"امروز، ۱۰:۲۴",duration:"۰۲:۱۸",status:"نیازمند بررسی",text:"در ارائه راهکار، ابتدا داده‌های بازار را مقایسه کرد و سپس پیشنهاد خود را با استدلال توضیح داد.",score:""},
{id:"v2",cid:"c1",kind:"تحلیل ارزیاب",exercise:"تحلیل بازار",sender:"مریم رضایی",time:"امروز، ۱۰:۳۱",duration:"۰۱:۰۶",status:"نیازمند تأیید نمره",text:"ارتباط مؤثر: ۸. تصمیم‌گیری: ۷. قوت: ساختاردهی روشن؛ قابل بهبود: بررسی ریسک‌های اجرایی.",score:"ارتباط مؤثر ۸ · تصمیم‌گیری ۷"},
{id:"v3",cid:"c2",kind:"تحلیل ارزیاب",exercise:"گفت‌وگوی مدیریتی",sender:"علی نوری",time:"امروز، ۰۹:۵۲",duration:"۰۰:۵۴",status:"نیازمند بررسی",text:"در مدیریت اختلاف، ابتدا نظر هر دو طرف را شنید و سپس درباره اقدام بعدی توافق گرفت.",score:"رهبری ۸"}]};
const labels={overview:"نمای کلی",candidates:"پرونده افراد",voices:"صندوق ویس‌ها",scores:"امتیازها",reports:"گزارش‌ها",cycle:"تنظیمات دوره"};
function n(x){if(x===null||x===undefined)return "—";let t=Number.isInteger(x)?String(x):Number(x).toFixed(1).replace(".", "٫");return t.replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[+d]})}
function average(c){let a=c.scores.map(function(x){return x[1]}).filter(function(x){return x!==null});return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function badge(s){let cls=s==="گزارش آماده"||s==="تأیید شد"?"green":s.indexOf("تأیید")>=0?"amber":"blue";return '<span class="badge '+cls+'">● '+s+'</span>'}
function person(c){return '<div class="person"><span class="avatar" style="background:'+c.color+'">'+c.initials+'</span><div><strong>'+c.name+'</strong><small>'+c.role+'</small></div></div>'}
function stat(t,v,f,i,bg,col){return '<div class="card stat"><div class="stathead"><span>'+t+'</span><span class="staticon" style="background:'+bg+';color:'+col+'">'+i+'</span></div><div class="statnum">'+v+'</div><div class="statfoot">'+f+'</div></div>'}
function wave(k){let s="";for(let i=0;i<k;i++)s+="<i></i>";return '<div class="wave">'+s+'</div>'}
function mini(v){let c=S.candidates.find(function(x){return x.id===v.cid});return '<div class="vrow"><button class="play" onclick="play(this)">▶</button><div class="vinfo"><b>'+v.kind+' · '+v.exercise+'</b>'+wave(17)+'<small>'+c.name+' · '+v.time+' · '+v.duration+'</small></div>'+badge(v.status)+'</div>'}
function chart(){let a=[[72,28],[58,42],[84,16],[48,52]];return a.map(function(x,i){return '<div class="bargrp"><i class="bar" style="height:'+x[0]+'%"></i><i class="bar pale" style="height:'+x[1]+'%"></i><span class="barlabel">تمرین '+n(i+1)+'</span></div>'}).join("")}
function overview(){let rows=S.candidates.slice(0,3).map(function(c){return '<tr><td>'+person(c)+'</td><td>'+badge(c.status)+'</td><td class="score">'+n(average(c))+'</td><td>'+c.assessor+'</td><td><button class="link" onclick="openCase(\''+c.id+'\')">مشاهده ←</button></td></tr>'}).join("");

function openModal(type){let title="",body="",foot="";
if(type==="voice"){title="ثبت ویس نمونه از تلگرام";body='<div class="notice info" style="margin-bottom:10px">در نمونه واقعی، ویس از ربات تلگرام می‌رسد. این فرم فقط دریافت و اتصال به پرونده را شبیه‌سازی می‌کند.</div><div class="formgrid"><div class="field"><label>ارزیابی‌شونده</label><select id="vc">'+S.candidates.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>'}).join("")+'</select></div><div class="field"><label>تمرین</label><select id="ve"><option>تحلیل بازار</option><option>گفت‌وگوی مدیریتی</option><option>ارائه راهبرد</option><option>سبد مکاتبات</option></select></div><div class="field"><label>نوع ویس</label><select id="vk"><option>صدای تمرین</option><option>تحلیل ارزیاب</option></select></div><div class="field"><label>ارزیاب</label><select id="vs"><option>مریم رضایی</option><option>علی نوری</option><option>سارا کاویانی</option></select></div><div class="field full"><label>متن نمونه برای شبیه‌سازی پیاده‌سازی</label><textarea id="vt">ارتباط مؤثر ۸، تصمیم‌گیری ۷. قوت: ساختاردهی روشن؛ قابل بهبود: بررسی ریسک‌های اجرایی.</textarea></div></div>';foot='<button class="btn" onclick="closeModal()">انصراف</button><button class="btn primary" onclick="addVoice()">＋ افزودن به صف بررسی</button>'}
else if(type==="report"){title="تهیه پیش‌نویس گزارش";body='<div class="notice info" style="margin-bottom:10px">گزارش بر اساس داده‌های تأییدشده، نمونه و دستورالعمل همان کارفرما ساخته می‌شود.</div><div class="formgrid"><div class="field"><label>نوع گزارش</label><select id="rt"><option>گزارش فردی</option><option>گزارش سازمانی</option></select></div><div class="field"><label>ارزیابی‌شونده</label><select id="rc">'+S.candidates.map(function(c){return '<option>'+c.name+'</option>'}).join("")+'</select></div><div class="field"><label>فونت</label><select id="rf" onchange="fontPreview(this.value)"><option>Tahoma</option><option>Segoe UI</option><option>Arial</option><option>فونت نمونه سازمان</option></select></div><div class="field"><label>قالب نمونه</label><select><option>نمونه گزارش کارفرما</option><option>نمونه دیگر</option></select></div><div class="field full"><label>درخواست کارفرما و دستورالعمل لحن</label><textarea id="rq">لحن رسمی و توسعه‌محور؛ پیشنهادها به شواهد پرونده متصل باشند.</textarea></div></div><div class="fontbox" id="fontbox" style="font-family:Tahoma"><b>پیش‌نمایش فونت و لحن</b><br>این متن با فونت انتخاب‌شده نمایش داده می‌شود.</div><div style="margin-top:10px">'+preview("نمونه چیدمان گزارش")+'</div>';foot='<button class="btn" onclick="closeModal()">انصراف</button><button class="btn primary" onclick="generateReport()">✦ ساخت پیش‌نویس</button>'}
else if(type==="cycle"){title="ایجاد دوره جدید";body='<div class="formgrid"><div class="field"><label>نام سازمان</label><input id="neworg" placeholder="مثلاً سازمان نمونه"></div><div class="field"><label>تاریخ کانون</label><input type="date"></div><div class="field"><label>نام دوره</label><input placeholder="کانون توسعه مدیران"></div><div class="field"><label>تاریخ یادآوری نگهداری</label><input type="date"></div></div><div class="notice info" style="margin-top:10px">نمونه گزارش، لوگو و دستورالعمل لحن هنگام تهیه گزارش درخواست می‌شوند، نه هنگام ایجاد دوره.</div>';foot='<button class="btn" onclick="closeModal()">انصراف</button><button class="btn primary" onclick="newCycle()">ساخت دوره</button>'}
else{title="افزودن ارزیابی‌شونده";body='<div class="formgrid"><div class="field"><label>نام و نام خانوادگی</label><input id="newcandidate" placeholder="نام فرد"></div><div class="field"><label>سمت فعلی</label><input placeholder="سمت سازمانی"></div></div>';foot='<button class="btn" onclick="closeModal()">انصراف</button><button class="btn primary" onclick="addCandidate()">افزودن به دوره</button>'}
document.getElementById("mtitle").textContent=title;document.getElementById("mbody").innerHTML=body;document.getElementById("mfoot").innerHTML=foot;document.getElementById("modalbg").classList.add("open")}
function closeModal(){document.getElementById("modalbg").classList.remove("open")}function closeOutside(e){if(e.target.id==="modalbg")closeModal()}
function fontPreview(x){document.getElementById("fontbox").style.fontFamily=x}
function addVoice(){let cid=document.getElementById("vc").value,c=S.candidates.find(function(x){return x.id===cid}),kind=document.getElementById("vk").value;S.voices.unshift({id:"v"+Date.now(),cid:cid,kind:kind,exercise:document.getElementById("ve").value,sender:document.getElementById("vs").value,time:"همین الان",duration:"۰۰:۴۸",status:kind==="تحلیل ارزیاب"?"نیازمند تأیید نمره":"نیازمند بررسی",text:document.getElementById("vt").value,score:kind==="تحلیل ارزیاب"?"ارتباط مؤثر ۸ · تصمیم‌گیری ۷":""});closeModal();go("voices");toast("ویس نمونه در پرونده "+c.name+" ثبت شد")}
function generateReport(){let type=document.getElementById("rt").value,c=document.getElementById("rc").value,f=document.getElementById("rf").value;S.reports++;closeModal();go("reports");toast(type+" برای "+c+" با فونت "+f+" آماده بازبینی مدیر شد")}
function newCycle(){let org=document.getElementById("neworg").value||"سازمان جدید";closeModal();go("cycle");toast("پوشه دوره برای "+org+" ایجاد شد")}
function addCandidate(){let name=document.getElementById("newcandidate").value;if(!name){toast("نام را وارد کنید");return}S.candidates.push({id:"c"+Date.now(),name:name,role:"سمت ثبت‌نشده",initials:name.slice(0,2),color:"#e6eef7",assessor:"تخصیص‌نیافته",status:"در حال ارزیابی",scores:[["رهبری",null,0],["تصمیم‌گیری",null,0],["ارتباط مؤثر",null,0],["تفکر تحلیلی",null,0]]});closeModal();go("candidates");toast("پرونده فرد ساخته شد")}
render();
</script>
</body>
</html>
